name: Secret scanning

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24.11"
          cache: false

      - name: Install Gitleaks 8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Reject tracked Codex runtime state
        run: test -z "$(git ls-files .codex)"

      - name: Scan complete event range
        run: .github/scripts/scan-pushed-secrets.sh

      - name: Test secret scanning controls
        run: tests/security/test-secret-scanning.sh
