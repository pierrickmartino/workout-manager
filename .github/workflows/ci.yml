name: CI

# Runs the test suites that already exist in the repo on every push and PR, so
# the 100+ backend/frontend tests and the terminology guard actually execute
# instead of relying on someone running them locally. See REVIEW.md for the
# domain invariants these checks defend.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pytest + terminology guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The suite is fully offline (SQLite, injected JWKS, fake LLM) — no live
      # Postgres/Redis/Clerk needed. The terminology guard runs as a test here.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing
        # The project's bar is 80% (see .claude/rules/common/testing.md). Turn the
        # gate on once the current baseline is confirmed at/above it:
        #   run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  web:
    name: Web (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lighthouse:
    name: Lighthouse (advisory)
    runs-on: ubuntu-latest
    # Advisory only (ADR-0028): assertions are `warn`, and the job never blocks a
    # merge. Lab scores wobble run-to-run on shared runners, so this is a reviewed
    # report — hard-fail gating is deferred until the numbers are stable and the
    # caching layer makes repeat-load LCP measurable. It audits the public shell
    # ("/"); authenticated routes need real Clerk + API and are out of scope here.
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    # Placeholder Clerk/API env so `next build` and `next start` succeed without
    # secrets — no real credentials, and only the public "/" route is audited.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_lighthouse_ci_placeholder
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # LHCI's default emulation is a throttled Moto G4 on slow 4G — the low-end
      # Android target from the performance bar. budgets.json (LightWallet) and the
      # warn assertions live in lighthouserc.json; results upload to a public link.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@^0.13.0 autorun
