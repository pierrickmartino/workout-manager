<!doctype html>
<!--
  ============================================================================
  PROTOTYPE — THROWAWAY. Not production. Not imported anywhere. Delete freely.
  ============================================================================

  QUESTION IT ANSWERS
    "Replace the anonymous muscle bars with a training ATLAS." Task #9. What
    should replace the flat, label-only MUSCLE COVERAGE checklist + MUSCLE SPLIT
    bars on the Stats screen (components/analytics/muscle-coverage.tsx +
    components/pulse/muscle-split.tsx)? Show a clean front/back body silhouette
    with the six real Muscle Groups as selectable regions. Selecting a region
    reveals its mapped sets in the window and the contributing exercises. A text
    list stays visible beneath — including unclassified activity.

  HOW TO RUN
    Double-click this file (open in any browser). No install, no backend.
      - Flip VARIANTS with the floating bottom bar, the < / > arrow keys,
        or ?variant=A|B|C in the URL.
      - Flip DATA SCENARIOS with the segmented control at the top of the phone,
        or ?scenario=balanced|upperFocus|crossTrain|empty.
      - Tap any lit muscle region (or a list row) to see its detail.

  WHY A STANDALONE HTML FILE (stated assumption, per the prototype skill)
    The skill's UI branch prefers variants mounted on the real /analytics route
    behind ?variant=. That route is a Server Component gated by <ClerkProvider>
    + a live FastAPI/Postgres backend, and apps/web/node_modules isn't installed,
    so an in-app route is NOT trivially runnable and could only show ONE data
    state. The atlas has to be judged across several training patterns (balanced
    vs. upper-only vs. cross-training vs. empty), and the per-region detail
    (contributing exercises, set counts) is data the current read model does not
    yet expose. So this mirrors the PULSE dark theme + Stats chrome in one
    double-click artifact — matching prototypes/training-route.html. The winning
    variant gets rebuilt as real PULSE React components + a widened read model.

  DESIGN RULES BAKED IN (from the task + repo invariants)
    - DESCRIPTIVE ONLY, never a verdict (ADR-0025). The atlas shows what HAS and
      HASN'T been trained + how much. An untrained region reads NEUTRAL (faint
      outline), never a red "you're behind — train legs" nudge. No ranking.
    - PRESENCE + VOLUME, not a proportion masquerading as a target. Heat intensity
      = how much you did, an honest description, not a quota fill.
    - CALENDAR-FREE (ADR-0001). Window is labeled "last 8 weeks", fixed and
      independent of the range toggle. No dates, no daily, no "today".
    - NEVER COLOR ALONE (accessibility). Every region is a real <button> with a
      composed aria-label; the text list carries the same data. Color is a second
      channel, never the only one.
    - UNCLASSIFIED is honest leftovers (issue #189): shown in the list + a neutral
      footnote, muted, NEVER a body region and NEVER a nudge. The body maps only
      the six real groups.

  KEY FINDING BAKED IN — PALETTE / TAXONOMY NORMALIZATION
    The shipped palette (components/pulse/muscle-colors.ts) REUSES hues:
      Legs & Arms  -> both bg-cyan       Chest & Core -> both bg-violet
    That is invisible on stacked bars (they're never adjacent by color) but FATAL
    on a body map, where Legs and Arms would render identically and Chest and Core
    would too. "Make the same colors meaningful across covers/illustrations/
    analytics" (the task's stated payoff) REQUIRES six distinct hues first. This
    prototype proposes a distinct-6 palette (see --g-* tokens below) that stays in
    the PULSE neon-on-dark family. Adopting the atlas means promoting these to
    real theme tokens and pointing GROUP_COLOR at them — that's the taxonomy
    normalization the task's "Large if..." effort note is about.
  ============================================================================
-->

<style>
  /* ---- PULSE dark tokens, transcribed from apps/web/app/globals.css ---- */
  :root {
    --base: #09090b;
    --surface: #18181b;
    --elevated: #27272a;
    --border: #27272a;
    --border-lite: #3f3f46;
    --text-primary: #fafafa;

    --cyan-dim: #29e7e01f;

    --radius-md: 8px;
    --radius-lg: 10px;

    /* PROPOSED distinct-6 atlas palette (see KEY FINDING above). Neon-on-dark,
       one hue per real Muscle Group so a body map can distinguish all six. */
    --g-legs: #29e7e0;       /* cyan     */
    --g-chest: #ff4d9d;      /* magenta  */
    --g-back: #4c8dff;       /* blue     */
    --g-shoulders: #ffb454;  /* amber    */
    --g-arms: #9a6bff;       /* violet   */
    --g-core: #35e08b;       /* green    */

  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #050506;
    color: var(--text-primary);
    font-family: var(--font-display);

  }

  .label-mono {
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ---- Phone shell: the 390px mobile frame from pulse.pen ---- */

    width: 100%;
    max-width: 390px;
    background: var(--base);
    border: 1px solid var(--border);

    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;

  .topbar .brand { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.2em; }

  /* Scenario segmented control */
  .scenario-bar { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }

  .section-head .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }

  .note {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em;

  }
  .empty-copy { font-family: var(--font-display); font-size: 14px; color: var(--text-secondary); line-height: 1.55; }

  /* ---- Atlas SVG ---- */
  .atlas { display: flex; gap: 6px; justify-content: center; }
  .atlas.stack { flex-direction: column; align-items: center; gap: 2px; }
  .body-fig { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .body-fig .view-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
  svg.body { width: 100%; max-width: 168px; height: auto; overflow: visible; }
  .silhouette { fill: #101014; stroke: var(--border-lite); stroke-width: 1; }
  .region {
    cursor: pointer; transition: fill-opacity 0.15s, stroke 0.15s, stroke-width 0.15s;
    stroke-width: 1; outline: none;
  }
  .region:focus-visible { stroke: var(--text-primary); stroke-width: 2; }

  /* Region-detail drawer (variant A) — shadcn Drawer bottom-sheet pattern */
  .scrim { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 60; width: 100%; max-width: 390px;
    transform: translate(-50%, 100%); transition: transform 0.24s cubic-bezier(0.32,0.72,0,1);
    background: var(--surface); border: 1px solid var(--border); border-bottom: 0;
    border-radius: 16px 16px 0 0; padding: 8px 20px 26px; box-shadow: 0 -18px 50px rgba(0,0,0,0.5);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .grabber { width: 36px; height: 4px; border-radius: 999px; background: var(--border-lite); margin: 6px auto 14px; }

  /* Detail block (shared by drawer + inline panel) */
  .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }

  .detail-stat .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; }

  .ex-row:first-of-type { border-top: 0; }

  /* Coverage list (shared "text list beneath") */
  .cov-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }

  .cov-row:first-child { border-top: 0; }
  .cov-row[aria-selected="true"] { background: var(--elevated); }
  .cov-row:hover { background: var(--elevated); }
  .cov-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .cov-dot.off { background: transparent !important; border: 1.5px solid var(--border-lite); }
  .cov-main { flex: 1; min-width: 0; }
  .cov-name { font-size: 15px; font-weight: 500; }
  .cov-sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 2px; }
  .cov-state { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .cov-state.on { color: var(--text-primary); }

  .cov-mini { height: 4px; border-radius: 2px; background: var(--elevated); overflow: hidden; margin-top: 6px; }

  /* Variant B two-pane */
  .pane-wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 14px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; min-height: 220px; }
  @media (max-width: 380px) { .pane-wrap { grid-template-columns: 1fr; } }

  /* Variant C expandable rows */
  .disclosure-ex { padding: 0 14px 12px 36px; }
  .caret { display: inline-block; transition: transform 0.15s; color: var(--text-muted); font-size: 10px; margin-left: auto; }
  .cov-row[aria-expanded="true"] .caret { transform: rotate(90deg); }

  .readout { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-muted); text-align: center; padding-top: 4px; text-transform: none; }

  /* ---- Floating variant switcher (hidden-in-prod convention noted) ---- */
  .switcher {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 70;
    display: flex; align-items: center; gap: 4px; background: #000; border: 1px solid var(--cyan);
    border-radius: 999px; padding: 6px 8px; box-shadow: 0 12px 40px rgba(41, 231, 224, 0.25);

  .switcher button { border: 0; background: transparent; color: var(--cyan); font-size: 18px; line-height: 1; cursor: pointer; padding: 6px 10px; border-radius: 999px; }
  .switcher button:hover { background: var(--cyan-dim); }
  .switcher .vlabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--text-primary); min-width: 190px; text-align: center; text-transform: uppercase; }
  .switcher .vlabel b { color: var(--cyan); }
</style>

  <div class="shell">
    <div class="topbar">

    <div class="content">

      <div class="scenario-bar" role="group" aria-label="Data scenario">

    <div id="sheet-body"></div>

  <div class="switcher" role="group" aria-label="Prototype variant switcher">

<script>
/* ==========================================================================
   TAXONOMY — the six real Muscle Groups (order from muscle-colors.ts).
   Unclassified is NOT one of them: it's honest leftovers, never a body region.
   ========================================================================== */
const GROUPS = ["Legs", "Chest", "Back", "Shoulders", "Arms", "Core"];
const GROUP_COLOR = {
  Legs: "var(--g-legs)", Chest: "var(--g-chest)", Back: "var(--g-back)",
  Shoulders: "var(--g-shoulders)", Arms: "var(--g-arms)", Core: "var(--g-core)",
};
const WEEKS = 8;
const WINDOW_LABEL = "last 8 weeks";

/* ==========================================================================
   FIXTURES — per-scenario mapped sets + contributing exercises per group.
   Mock detail the current read model doesn't expose yet (that's the point of
   the prototype). Deterministic. `unclassified` is separate leftovers.
   ========================================================================== */
function g(sets, exercises) { return { sets, exercises: exercises || [] }; }

const SCENARIOS = {
  // Well-rotated self-paced athlete — every group trained, varied volume.
  balanced: {
    label: "Balanced", groups: {
      Legs: g(22, [["Back Squat", 8], ["Romanian Deadlift", 6], ["Leg Press", 5], ["Standing Calf Raise", 3]]),
      Chest: g(14, [["Bench Press", 7], ["Incline DB Press", 4], ["Cable Fly", 3]]),
      Back: g(18, [["Pull-up", 6], ["Barbell Row", 6], ["Lat Pulldown", 4], ["Face Pull", 2]]),
      Shoulders: g(9, [["Overhead Press", 5], ["Lateral Raise", 4]]),
      Arms: g(11, [["Barbell Curl", 4], ["Triceps Pushdown", 4], ["Hammer Curl", 3]]),
      Core: g(7, [["Hanging Leg Raise", 3], ["Cable Crunch", 2], ["Pallof Press", 2]]),
    }, unclassified: null,
  },
  // Upper-body block — legs & core NOT trained. They must read NEUTRAL, never
  // scolded (ADR-0025). This scenario stress-tests the "no nudge" rule.
  upperFocus: {
    label: "Upper focus", groups: {
      Legs: g(0, []),
      Chest: g(19, [["Bench Press", 8], ["Incline DB Press", 6], ["Cable Fly", 3], ["Dip", 2]]),
      Back: g(20, [["Weighted Pull-up", 7], ["Pendlay Row", 6], ["Lat Pulldown", 5], ["Face Pull", 2]]),
      Shoulders: g(13, [["Overhead Press", 6], ["Lateral Raise", 5], ["Rear Delt Fly", 2]]),
      Arms: g(16, [["Barbell Curl", 6], ["Skullcrusher", 5], ["Hammer Curl", 5]]),
      Core: g(0, []),
    }, unclassified: null,
  },
  // Strength + conditioning — some groups trained, plus work we don't map
  // (yoga / mobility / sled). Drives the unclassified row + neutral footnote.
  crossTrain: {
    label: "Cross-train", groups: {
      Legs: g(12, [["Front Squat", 6], ["Walking Lunge", 4], ["Calf Raise", 2]]),
      Chest: g(6, [["Push-up", 4], ["DB Bench Press", 2]]),
      Back: g(10, [["Chin-up", 5], ["Seal Row", 5]]),
      Shoulders: g(4, [["Landmine Press", 4]]),
      Arms: g(0, []),
      Core: g(9, [["Ab Wheel", 4], ["Plank", 3], ["Side Plank", 2]]),
    },
    unclassified: { sets: 8, activities: [["Vinyasa Flow", 4], ["Mobility Circuit", 2], ["Sled Push", 2]] },
  },
  // Nothing logged in the window — one teaching empty state, not six "not
  // trained" rows (mirrors toCoverageView isEmpty).
  empty: { label: "Empty", groups: {
      Legs: g(0), Chest: g(0), Back: g(0), Shoulders: g(0), Arms: g(0), Core: g(0),
    }, unclassified: null,
  },
};

/* Derived helpers -------------------------------------------------------- */
function totalRealSets(data) { return GROUPS.reduce((n, k) => n + data.groups[k].sets, 0); }
function maxSets(data) { return Math.max(1, ...GROUPS.map((k) => data.groups[k].sets)); }
function sharePct(data, group) {
  const total = totalRealSets(data);
  return total === 0 ? 0 : Math.round((data.groups[group].sets / total) * 100);
}
function isEmptyWindow(data) { return totalRealSets(data) === 0 && !data.unclassified; }
function stateOf(data, group) { return data.groups[group].sets > 0; } // trained?

/* ==========================================================================
   BODY SVG — one accessible silhouette, built from region shapes mapped to the
   six groups. Every region always renders (faint if untrained) so the figure
   always reads as a body. Front & back share the head/neck neutral silhouette.
   Stylized, not anatomically exact — final illustration is the "medium" polish
   the task calls out; the MAPPING (region -> group) is the load-bearing part.
   ========================================================================== */

// Region specs. Each entry: { group, shapes:[svg-element-strings without fill] }.
// Coordinates on a 140 x 300 viewBox, symmetric about x=70.
const FRONT = [
  { group: "Shoulders", shapes: ['<ellipse cx="44" cy="72" rx="15" ry="11"/>', '<ellipse cx="96" cy="72" rx="15" ry="11"/>'] },
  { group: "Chest", shapes: ['<path d="M50 74 h18 v14 q0 8 -9 9 q-11 -1 -12 -12 z"/>', '<path d="M90 74 h-18 v14 q0 8 9 9 q11 -1 12 -12 z"/>'] },
  { group: "Arms", shapes: [
      '<path d="M27 68 q-6 2 -6 12 l3 34 q1 8 8 8 q7 0 7 -9 l-3 -37 q-1 -9 -9 -8 z"/>',
      '<rect x="24" y="120" width="13" height="40" rx="6"/>',
      '<path d="M113 68 q6 2 6 12 l-3 34 q-1 8 -8 8 q-7 0 -7 -9 l3 -37 q1 -9 9 -8 z"/>',
      '<rect x="103" y="120" width="13" height="40" rx="6"/>'] },
  { group: "Core", shapes: ['<rect x="54" y="98" width="32" height="48" rx="9"/>'] },
  { group: "Legs", shapes: [
      '<path d="M50 150 h17 l-2 62 q-1 9 -8 9 q-7 0 -8 -9 z"/>',
      '<rect x="49" y="224" width="15" height="58" rx="7"/>',
      '<path d="M90 150 h-17 l2 62 q1 9 8 9 q7 0 8 -9 z"/>',
      '<rect x="76" y="224" width="15" height="58" rx="7"/>'] },
];
const BACK = [
  { group: "Shoulders", shapes: ['<ellipse cx="44" cy="72" rx="15" ry="11"/>', '<ellipse cx="96" cy="72" rx="15" ry="11"/>'] },
  { group: "Back", shapes: ['<path d="M48 72 h44 v30 q-2 18 -22 20 q-20 -2 -22 -20 z"/>'] },
  { group: "Arms", shapes: [
      '<path d="M27 68 q-6 2 -6 12 l3 34 q1 8 8 8 q7 0 7 -9 l-3 -37 q-1 -9 -9 -8 z"/>',
      '<rect x="24" y="120" width="13" height="40" rx="6"/>',
      '<path d="M113 68 q6 2 6 12 l-3 34 q-1 8 -8 8 q-7 0 -7 -9 l3 -37 q1 -9 9 -8 z"/>',
      '<rect x="103" y="120" width="13" height="40" rx="6"/>'] },
  { group: "Core", shapes: ['<rect x="56" y="124" width="28" height="20" rx="7"/>'] }, // lower back
  { group: "Legs", shapes: [
      '<rect x="50" y="148" width="40" height="26" rx="12"/>',                          // glutes
      '<path d="M50 176 h17 l-2 46 q-1 9 -8 9 q-7 0 -8 -9 z"/>',
      '<rect x="49" y="234" width="15" height="50" rx="7"/>',
      '<path d="M90 176 h-17 l2 46 q1 9 8 9 q7 0 8 -9 z"/>',
      '<rect x="76" y="234" width="15" height="50" rx="7"/>'] },
];
const HEAD_NECK = '<circle class="silhouette" cx="70" cy="26" r="15"/><path class="silhouette" d="M62 39 h16 v7 q-8 4 -16 0 z"/>';

// Fill opacity from training volume: trained regions warm up with intensity;
// untrained render as a faint neutral outline (NO fill) — descriptive, no alarm.
function regionStyle(group, data, selected) {
  const trained = stateOf(data, group);
  const isSel = selected === group;
  const color = GROUP_COLOR[group];
  if (!trained) {
    return `fill:${color};fill-opacity:0;stroke:${isSel ? 'var(--text-primary)' : 'var(--border-lite)'};stroke-width:${isSel ? 2 : 1};stroke-dasharray:3 3`;
  }
  const intensity = data.groups[group].sets / maxSets(data); // 0..1
  const op = (0.22 + 0.6 * intensity).toFixed(2);
  const stroke = isSel ? "var(--text-primary)" : color;
  return `fill:${color};fill-opacity:${isSel ? 0.95 : op};stroke:${stroke};stroke-width:${isSel ? 2 : 1}`;
}

function buildBody(view, data, selected) {
  const spec = view === "front" ? FRONT : BACK;
  const regions = spec.map((r) => {
    const label = `${r.group}: ${stateOf(data, r.group) ? `${data.groups[r.group].sets} sets in the ${WINDOW_LABEL}` : `not trained in the ${WINDOW_LABEL}`}`;
    const style = regionStyle(r.group, data, selected);
    const shapes = r.shapes.map((s) => s.replace(/^<(\w+)/, `<$1 class="region" data-group="${r.group}" style="${style}" tabindex="0" role="button" aria-label="${label}"`)).join("");
    // Group the shapes so a single region reads as one node visually.
    return `<g>${shapes}</g>`;
  }).join("");
  return `<svg class="body" viewBox="0 0 140 300" aria-hidden="false">${HEAD_NECK}${regions}</svg>`;
}

/* ==========================================================================
   SHARED DETAIL BLOCK — used by the drawer (A) and inline panels (B, C).
   Descriptive only: sets + share + contributing exercises. No verdict.
   ========================================================================== */
function detailBlock(data, group) {
  if (!group) {
    return `<p class="detail-empty">Tap a muscle region or a list row to see its mapped sets and the exercises that trained it — over the ${WINDOW_LABEL}.</p>`;
  }
  const gd = data.groups[group];
  const trained = gd.sets > 0;
  const color = GROUP_COLOR[group];
  const stateTxt = trained ? "Trained" : "Not trained";
  const stateCol = trained ? color : "var(--text-muted)";
  const head = `
    <div class="detail-head">
      <span class="swatch" style="background:${color}"></span>
      <span class="detail-name">${group}</span>
      <span class="detail-state" style="color:${stateCol}; margin-left:auto">${stateTxt}</span>
    </div>`;
  if (!trained) {
    return head + `<p class="detail-empty">No ${group.toLowerCase()} sets in the ${WINDOW_LABEL} yet. When you log some, they'll map here.</p>`;
  }
  const stats = `
    <div class="detail-stat-row">
      <div class="detail-stat"><div class="k">Mapped sets</div><div class="v">${gd.sets}</div></div>
      <div class="detail-stat"><div class="k">Share of window</div><div class="v">${sharePct(data, group)}<small>%</small></div></div>
    </div>`;
  const exs = `<div class="ex-head">Contributing exercises</div>` + gd.exercises.map((e) =>
    `<div class="ex-row"><span class="ex-name">${e[0]}</span><span class="ex-sets">${e[1]} ${e[1] === 1 ? "set" : "sets"}</span></div>`).join("");
  return head + stats + exs;
}

/* ==========================================================================
   SHARED COVERAGE LIST — "text list remains visible beneath, including
   unclassified activity." Six real rows always (when non-empty); unclassified
   as a disclosure row + footnote, never a body region.
   `interactive` rows select a group; `expandable` rows toggle exercises (C).
   ========================================================================== */
function coverageList(data, selected, mode) {
  const rows = GROUPS.map((group) => {
    const gd = data.groups[group];
    const trained = gd.sets > 0;
    const color = GROUP_COLOR[group];
    const dot = `<span class="cov-dot ${trained ? "" : "off"}" style="${trained ? `background:${color}` : ""}"></span>`;
    const top = trained && gd.exercises.length ? `${gd.exercises[0][0]}` : "";
    const sub = trained
      ? `<div class="cov-sub">${gd.sets} sets · ${sharePct(data, group)}%${top ? ` · top: ${top}` : ""}</div>`
      : `<div class="cov-sub">Not trained in the ${WINDOW_LABEL}</div>`;
    const mini = trained
      ? `<div class="cov-mini"><span style="width:${Math.round((gd.sets / maxSets(data)) * 100)}%;background:${color}"></span></div>`
      : "";
    const state = `<span class="cov-state ${trained ? "on" : "off"}">${trained ? "Trained" : "Not trained"}</span>`;
    const caret = mode === "expandable" ? `<span class="caret">▸</span>` : "";
    const tail = mode === "expandable" ? caret : state;
    const attrs = mode === "expandable"
      ? `data-expand="${group}" aria-expanded="${selected === group}"`
      : `data-select="${group}" aria-selected="${selected === group}"`;
    const exPanel = (mode === "expandable" && selected === group && trained)
      ? `<div class="disclosure-ex">${gd.exercises.map((e) => `<div class="ex-row"><span class="ex-name">${e[0]}</span><span class="ex-sets">${e[1]} ${e[1] === 1 ? "set" : "sets"}</span></div>`).join("")}</div>`
      : "";
    return `
      <button class="cov-row" ${attrs}>
        ${dot}
        <span class="cov-main"><span class="cov-name">${group}</span>${sub}${mini}</span>
        ${tail}
      </button>${exPanel}`;
  }).join("");

  const unc = data.unclassified
    ? `<div class="cov-row" style="cursor:default">
         <span class="cov-dot off" style="border-color:var(--g-unclassified)"></span>
         <span class="cov-main"><span class="cov-name" style="color:var(--text-secondary)">Unclassified</span>
           <div class="cov-sub">${data.unclassified.sets} sets we don't map yet</div></span>
         <span class="cov-state off">Off-map</span>
       </div>`
    : "";

  return `<div class="cov-list">${rows}${unc}</div>`;
}

function footnote(data) {
  return data.unclassified
    ? `<p class="note">Some recent sets list muscles we don't map yet — shown above as Unclassified, not folded into a Muscle Group.</p>`
    : "";
}

const WINDOW_META = `${WINDOW_LABEL} · presence + volume`;

function emptyState() {
  return `<div class="card pad"><p class="empty-copy">No training logged in the ${WINDOW_LABEL} yet. Log a few sessions and each Muscle Group you train will light up on the atlas.</p></div>`;
}

/* ==========================================================================
   VARIANT A — DUAL SILHOUETTE + DRAWER (body leads; detail as bottom sheet)
   Front & back side-by-side, heat-shaded. Tap a region -> drawer. Full text
   list beneath. The literal reading of the task's named resources.
   ========================================================================== */
function renderA(data, selected) {
  if (isEmptyWindow(data)) {
    return `<div class="section-head"><span class="title">Muscle Atlas</span><span class="meta">${WINDOW_LABEL}</span></div>
      <div class="card pad" style="display:flex;flex-direction:column;gap:14px;align-items:center">
        <div class="atlas">${buildBody("front", data, null)}${buildBody("back", data, null)}</div>
        <p class="empty-copy" style="text-align:center">No training logged in the ${WINDOW_LABEL} yet. Log a few sessions and your atlas will light up, group by group.</p>
      </div>`;
  }
  return `
    <div class="section-head"><span class="title">Muscle Atlas</span><span class="meta">${WINDOW_META}</span></div>
    <div class="card pad" style="margin-bottom:18px">
      <div class="atlas">
        <div class="body-fig"><span class="view-label">Front</span>${buildBody("front", data, selected)}</div>
        <div class="body-fig"><span class="view-label">Back</span>${buildBody("back", data, selected)}</div>
      </div>
    </div>
    <div class="section-head"><span class="title">Coverage</span><span class="meta">tap for detail</span></div>
    ${coverageList(data, selected, "select")}
    ${footnote(data)}
    <p class="note" style="margin-top:12px">Descriptive only — presence and volume over a fixed window. Nothing here flags an “under-trained” group or prescribes work.</p>`;
}

/* ==========================================================================
   VARIANT B — ATLAS NAVIGATOR + PERSISTENT PANEL (two coordinated panes)
   One body with a front/back toggle; a detail panel that is ALWAYS visible
   beside it and updates in place (no overlay). Roster list beneath.
   ========================================================================== */
function renderB(data, selected, view) {
  if (isEmptyWindow(data)) return renderA(data, null); // same teaching empty
  const v = view || "front";
  return `
    <div class="section-head"><span class="title">Muscle Atlas</span><span class="meta">${WINDOW_META}</span></div>
    <div class="pane-wrap">
      <div class="card pad" style="display:flex;flex-direction:column;gap:12px;align-items:center">
        <div class="scenario-bar" style="width:100%" role="group" aria-label="Body view">
          <button data-view="front" aria-pressed="${v === "front"}">Front</button>
          <button data-view="back" aria-pressed="${v === "back"}">Back</button>
        </div>
        ${buildBody(v, data, selected)}
      </div>
      <div class="panel">${detailBlock(data, selected)}</div>
    </div>
    <div class="section-head" style="margin-top:18px"><span class="title">All groups</span><span class="meta">${WINDOW_LABEL}</span></div>
    ${coverageList(data, selected, "select")}
    ${footnote(data)}`;
}

/* ==========================================================================
   VARIANT C — COVERAGE LEDGER + BODY KEY (list leads; body confirms)
   The ranked text list is primary; rows expand in place to show contributing
   exercises. A compact body "key" up top highlights the expanded group. Closest
   to today's checklist, text-first & screen-reader-friendly, but anatomical.
   ========================================================================== */
function renderC(data, selected) {
  if (isEmptyWindow(data)) return renderA(data, null);
  return `
    <div class="section-head"><span class="title">Muscle Atlas</span><span class="meta">${WINDOW_META}</span></div>
    <div class="card pad" style="margin-bottom:16px">
      <div class="atlas stack">
        <div class="atlas">
          <div class="body-fig"><span class="view-label">Front</span>${buildBody("front", data, selected)}</div>
          <div class="body-fig"><span class="view-label">Back</span>${buildBody("back", data, selected)}</div>
        </div>
        <span class="note" style="margin-top:6px">${selected ? `Highlighting <b style="color:var(--text-primary)">${selected}</b> — tap a row to change.` : "Tap a row below to highlight it on the body."}</span>
      </div>
    </div>
    <div class="section-head"><span class="title">Coverage ledger</span><span class="meta">tap to expand</span></div>
    ${coverageList(data, selected, "expandable")}
    ${footnote(data)}`;
}

/* ==========================================================================
   SWITCHER + STATE
   ========================================================================== */
const VARIANTS = {
  A: { name: "Dual body + drawer", render: (d, s, st) => renderA(d, s) },
  B: { name: "Navigator + panel", render: (d, s, st) => renderB(d, s, st.view) },
  C: { name: "Ledger + body key", render: (d, s, st) => renderC(d, s) },
};
const ORDER = ["A", "B", "C"];

function readParams() {
  const q = new URLSearchParams(location.search);
  const v = (q.get("variant") || "A").toUpperCase();
  const s = q.get("scenario") || "balanced";
  return { variant: VARIANTS[v] ? v : "A", scenario: SCENARIOS[s] ? s : "balanced" };
}
function writeParams() {
  const q = new URLSearchParams(location.search);
  q.set("variant", state.variant); q.set("scenario", state.scenario);
  history.replaceState(null, "", "?" + q.toString());
}

let state = { ...readParams(), selected: null, view: "front", drawerOpen: false };

const scrim = document.getElementById("scrim");
const sheet = document.getElementById("sheet");

function openDrawer() {
  document.getElementById("sheet-body").innerHTML = detailBlock(SCENARIOS[state.scenario], state.selected);
  scrim.classList.add("open"); sheet.classList.add("open"); state.drawerOpen = true;
}
function closeDrawer() {
  scrim.classList.remove("open"); sheet.classList.remove("open"); state.drawerOpen = false;
}

function paint() {
  const data = SCENARIOS[state.scenario];
  document.getElementById("mount").innerHTML = VARIANTS[state.variant].render(data, state.selected, state);
  document.getElementById("vlabel").innerHTML = `<b>${state.variant}</b> — ${VARIANTS[state.variant].name}`;

  const sel = state.selected;
  const selTxt = sel
    ? `${sel}: ${data.groups[sel].sets} sets (${sharePct(data, sel)}%), ${data.groups[sel].exercises.length} exercises`
    : "none";
  document.getElementById("readout").textContent =
    `variant=${state.variant} · scenario=${state.scenario} · selected=${selTxt}`;

  document.querySelectorAll(".scenario-bar button[data-scenario]").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.scenario === state.scenario);
  });
  writeParams();
}

function selectGroup(group) {
  const data = SCENARIOS[state.scenario];
  state.selected = state.selected === group ? null : group;
  // Variant A opens the drawer on select (and only when a group is now active).
  if (state.variant === "A") {
    if (state.selected) openDrawer(); else closeDrawer();
  }
  paint();
}

/* Delegated clicks inside the mounted variant. */
document.getElementById("mount").addEventListener("click", (e) => {
  const region = e.target.closest(".region");
  if (region) { selectGroup(region.dataset.group); return; }
  const selRow = e.target.closest("[data-select]");
  if (selRow) { selectGroup(selRow.dataset.select); return; }
  const expRow = e.target.closest("[data-expand]");
  if (expRow) { selectGroup(expRow.dataset.expand); return; }
  const viewBtn = e.target.closest("[data-view]");
  if (viewBtn) { state.view = viewBtn.dataset.view; paint(); return; }
});
// Keyboard activation for SVG regions (they're role=button, tabindex=0).
document.getElementById("mount").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const region = e.target.closest(".region");
  if (region) { e.preventDefault(); selectGroup(region.dataset.group); }
});

scrim.addEventListener("click", () => { state.selected = null; closeDrawer(); paint(); });

document.querySelectorAll(".scenario-bar button[data-scenario]").forEach((b) => {
  b.addEventListener("click", () => { state.scenario = b.dataset.scenario; state.selected = null; state.view = "front"; closeDrawer(); paint(); });
});

function cycle(dir) {
  const i = ORDER.indexOf(state.variant);
  state.variant = ORDER[(i + dir + ORDER.length) % ORDER.length];
  state.selected = null; closeDrawer(); paint();
}
document.getElementById("prev").addEventListener("click", () => cycle(-1));
document.getElementById("next").addEventListener("click", () => cycle(1));

window.addEventListener("keydown", (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
  if (e.key === "Escape" && state.drawerOpen) { state.selected = null; closeDrawer(); paint(); return; }
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

paint();
</script>
</body>
</html>
