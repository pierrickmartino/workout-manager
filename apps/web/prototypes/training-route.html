<!doctype html>
<!--
  ============================================================================
  PROTOTYPE — THROWAWAY. Not production. Not imported anywhere. Delete freely.
  ============================================================================

  QUESTION IT ANSWERS
    "Turn the plan into a readable training ROUTE." What should replace the
    current tiny, ambiguous week dots (components/pulse/week-cycle-strip.tsx)
    on the Dashboard week strip / training-plan view? Show the current week as
    a short route with NAMED stops (Upper A, Lower A, Upper B, Lower B):
      - completed stops    -> solid marker
      - the next stop      -> clearly labeled OUTLINE
      - later stops        -> still readable (not a faint dot)
    with an expandable week list for the rest of the plan.

  HOW TO RUN
    Double-click this file (open in any browser). No install, no backend.
      - Flip VARIANTS with the floating bottom bar, the < / > arrow keys,
        or ?variant=A|B|C in the URL.
      - Flip DATA SCENARIOS with the segmented control at the top of the phone,
        or ?scenario=fresh|current|weekComplete.

  WHY A STANDALONE HTML FILE (stated assumption, per the prototype skill)
    The skill's UI branch prefers variants mounted on the real /dashboard route
    behind a ?variant= param. Here that route is a Server Component gated by
    <ClerkProvider> (root layout) + a live FastAPI/Postgres backend, and
    apps/web/node_modules isn't installed -- so an in-app route is NOT trivially
    runnable, and it could only show ONE protocol state. This prototype needs to
    contrast THREE states. So this file mirrors the PULSE dark theme, fonts, and
    dashboard chrome (from apps/web/app/globals.css + the pulse/* components) in
    a single double-click artifact. What you see is faithful to what would ship;
    the winning variant gets rebuilt properly as real PULSE React components.

  DESIGN RULES BAKED IN (from the task + repo invariants)
    - "session N of M" (your POSITION in the sequence) and "X completed"
      (how many you've finished) are DIFFERENT numbers, shown apart. In a linear
      plan N = completed + 1, so e.g. "session 6 of 32" sits next to "5 done".
    - Positional only. NO calendar dates (ADR-0001/0008): the plan is defined by
      sequence, so we do NOT invent dates. Rest-vs-missed is a dates-only
      distinction and is called out as such, never faked.
    - Scroll position NEVER stands in for completion -- completion is always an
      explicit marker + counter, independent of how far you've scrolled.
    - Composition reference: Aceternity's Timeline, adapted to a compact mobile
      route with EXPLICIT buttons (Start / View), not scroll-driven reveal.
  ============================================================================
-->
<html lang="en">

<body>
  <div class="shell">
    <div class="topbar">
      <span class="brand">PULSE<span class="slash"> //</span></span>
      <span class="avatar"></span>
    </div>
    <div class="content">
      <div>
        <div class="page-overline label-mono">PULSE // DASHBOARD</div>
        <h1 class="page-title">Hey, operator</h1>
      </div>

      <div class="scenario-bar" role="group" aria-label="Data scenario">
        <button data-scenario="fresh">Fresh · 0 done</button>
        <button data-scenario="current">Current week</button>
        <button data-scenario="weekComplete">Week complete</button>
      </div>

      <div id="mount"></div>

      <div class="readout" id="readout"></div>
    </div>
  </div>

  <div class="switcher" role="group" aria-label="Prototype variant switcher">
    <button id="prev" aria-label="Previous variant">&#8249;</button>
    <span class="vlabel" id="vlabel"></span>
    <button id="next" aria-label="Next variant">&#8250;</button>
  </div>

<script>
/* ==========================================================================
   FIXTURES — mirror ProtocolProgress / ProtocolSession (lib/protocols-types.ts).
   Positional only. NO dates: the plan is defined by sequence (ADR-0001/0008).
   ========================================================================== */
const SESSION_TITLES = ["Upper A", "Lower A", "Upper B", "Lower B"];
const PER_WEEK = 4;
const WEEKS = 8;
const TOTAL = WEEKS * PER_WEEK; // 32

// Build a protocol at a given number of completed sessions. Sessions advance
// strictly in order (ADR-0013), so the completed sessions are the prefix and
// the Next Session is the first un-performed one.
function buildProtocol(completed) {
  const sessions = [];
  for (let pos = 1; pos <= TOTAL; pos++) {
    sessions.push({
      session_id: pos,
      position: pos,
      week: Math.ceil(pos / PER_WEEK),
      day: ((pos - 1) % PER_WEEK) + 1,
      title: SESSION_TITLES[(pos - 1) % PER_WEEK],
      performed: pos <= completed,
    });
  }
  const next = sessions.find((s) => !s.performed) || null;
  return {
    weeks: WEEKS,
    total: TOTAL,
    completed_count: completed,
    sessions,
    next_session: next,
    // position in the SEQUENCE (1-based) = the next session's absolute position.
    // Deliberately distinct from completed_count (this is "N of M", that is "X done").
    position: next ? next.position : TOTAL,
  };
}

const SCENARIOS = {
  // Unscheduled plan, nothing done yet: "session 1 of 32" vs "0 completed".
  fresh: buildProtocol(0),
  // Mid-flight: week 1 fully done, one into week 2 -> "session 6 of 32", 5 done.
  current: buildProtocol(5),
  // A whole week just finished: week 1 all-solid, week 2 fresh -> "session 5 of 32", 4 done.
  weekComplete: buildProtocol(4),
};

function stateOf(session, nextPos) {
  if (session.position < nextPos) return "done";
  if (session.position === nextPos) return "next";
  return "up";
}
function sessionsForWeek(p, week) {
  return p.sessions.filter((s) => s.week === week).sort((a, b) => a.position - b.position);
}
const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

const NO_DATE_NOTE =
  'Sequence-only plan &mdash; no calendar dates. Rest vs. missed sessions would show only if the plan were scheduled; none are invented here.';

/* ==========================================================================
   VARIANT A — ROUTE LINE (vertical timeline, Aceternity-adapted)
   ========================================================================== */
function renderA(p) {
  const nextPos = p.next_session ? p.next_session.position : Infinity;
  const currentWeek = p.next_session ? p.next_session.week : p.weeks;
  const stops = sessionsForWeek(p, currentWeek);

  const stopHtml = (s, isLast) => {
    const st = stateOf(s, nextPos);
    const lineDone = s.position < nextPos ? "done" : "";
    const inner = st === "done" ? TICK : "";
    const actions =
      st === "next"
        ? '<div class="stop-actions"><a class="btn btn-primary btn-tiny" href="#">▶ Start session</a></div>'
        : st === "done"
        ? '<div class="stop-actions"><a class="btn btn-ghost btn-tiny" href="#">View log</a></div>'
        : "";
    const badge =
      st === "next" ? '<span class="chip next">Next up</span>'
      : st === "done" ? '<span class="chip done">Done</span>'
      : '<span class="chip up">Upcoming</span>';
    return `
      <div class="stop ${st}">
        <div class="rail">
          <span class="node ${st}" style="height:26px;width:26px">${inner}</span>
          ${isLast ? "" : `<span class="line ${lineDone}"></span>`}
        </div>
        <div class="body">
          <div style="display:flex;align-items:center;gap:8px;justify-content:space-between">
            <span class="stop-name">${s.title}</span>${badge}
          </div>
          <span class="stop-meta">Session ${s.position} · Week ${s.week} · Day ${s.day}</span>
          ${actions}
        </div>
      </div>`;
  };

  const laterWeeks = [];
  for (let w = currentWeek + 1; w <= p.weeks; w++) laterWeeks.push(w);
  const laterHtml = laterWeeks
    .map((w) => {
      const rows = sessionsForWeek(p, w)
        .map((s) => {
          const st = stateOf(s, nextPos);
          const inner = st === "done" ? TICK : "";
          return `<div class="stop ${st}"><div class="rail"><span class="node ${st}" style="height:20px;width:20px">${inner}</span><span class="line ${s.position < nextPos ? "done" : ""}"></span></div><div class="body" style="padding-bottom:14px"><span class="stop-name" style="font-size:13px">${s.title}</span><span class="stop-meta">Session ${s.position} · Day ${s.day}</span></div></div>`;
        })
        .join("");
      return `<div class="weekgroup"><div class="wk-label">Week ${w}</div><div class="route">${rows}</div></div>`;
    })
    .join("");

  return `
    <div class="card vA">
      <div class="card-eyebrow">
        <span class="lead">▸ Route // Week ${currentWeek} of ${p.weeks}</span>
        <span class="count">${p.position} of ${p.total} · ${p.completed_count} done</span>
      </div>
      <p class="no-date-note" style="margin:2px 0 16px">${NO_DATE_NOTE}</p>
      <div class="route">${stops.map((s, i) => stopHtml(s, i === stops.length - 1 && laterWeeks.length === 0)).join("")}</div>
      ${
        laterWeeks.length
          ? `<button class="disclosure" data-toggle="A"><span class="caret">▸</span> Show full plan (${laterWeeks.length} more weeks)</button>
             <div data-panel="A" hidden style="margin-top:6px">${laterHtml}</div>`
          : ""
      }
    </div>`;
}

/* ==========================================================================
   VARIANT B — METRO LINE (horizontal subway route)
   ========================================================================== */
function renderB(p) {
  const nextPos = p.next_session ? p.next_session.position : Infinity;
  const currentWeek = p.next_session ? p.next_session.week : p.weeks;
  const stops = sessionsForWeek(p, currentWeek);

  const stationHtml = (s, isLast) => {
    const st = stateOf(s, nextPos);
    const inner = st === "done" ? TICK : st === "next" ? "" : "";
    const tag = st === "done" ? "Done" : st === "next" ? "◆ Next" : "Upcoming";
    return `
      <div class="station ${st}">
        <span class="connector ${s.position < nextPos ? "done" : ""}"></span>
        <span class="node ${st}" style="height:30px;width:30px">${inner}</span>
        <span class="st-name">${s.title}</span>
        <span class="st-tag ${st}">${tag}</span>
      </div>`;
  };

  const next = p.next_session;
  const nextPanel = next
    ? `<div class="next-panel">
         <span class="node next" style="height:34px;width:34px"></span>
         <div style="flex:1">
           <div class="np-name">${next.title}</div>
           <div class="np-meta">Next stop · Session ${next.position} of ${p.total}</div>
         </div>
         <a class="btn btn-primary btn-tiny" href="#">▶ Start</a>
       </div>`
    : `<div class="next-panel"><div style="flex:1"><div class="np-name">Protocol complete</div><div class="np-meta">All ${p.total} sessions logged</div></div></div>`;

  const laterWeeks = [];
  for (let w = currentWeek + 1; w <= p.weeks; w++) laterWeeks.push(w);
  const laterHtml = laterWeeks
    .map((w) => {
      const rows = sessionsForWeek(p, w)
        .map((s) => {
          const st = stateOf(s, nextPos);
          const dotColor = st === "done" ? "var(--cyan)" : st === "next" ? "transparent" : "var(--base)";
          const dotBorder = st === "next" ? "2px solid var(--cyan)" : st === "up" ? "1.5px solid var(--border-lite)" : "none";
          return `<div class="wk-row ${st}"><span class="dot" style="background:${dotColor};border:${dotBorder}"></span><span class="wname">${s.title}</span><span class="chip ${st === "up" ? "up" : st}">${st === "done" ? "Done" : st === "next" ? "Next" : "Upcoming"}</span></div>`;
        })
        .join("");
      return `<div style="margin-top:10px"><div class="divider"><span class="lbl" style="font-size:10px">Week ${w}</span><span class="rule"></span></div>${rows}</div>`;
    })
    .join("");

  return `
    <div class="card vB">
      <div class="card-eyebrow">
        <span class="lead">▸ Line // Week ${currentWeek}</span>
        <span class="count">${p.position} of ${p.total} · ${p.completed_count} done</span>
      </div>
      <div class="track-wrap"><div class="track">${stops.map((s, i) => stationHtml(s, i === stops.length - 1)).join("")}</div></div>
      ${nextPanel}
      <p class="no-date-note" style="margin:14px 0 0">${NO_DATE_NOTE}</p>
      ${
        laterWeeks.length
          ? `<button class="disclosure" data-toggle="B"><span class="caret">▸</span> Rest of the line (${laterWeeks.length} weeks)</button>
             <div data-panel="B" hidden>${laterHtml}</div>`
          : ""
      }
    </div>`;
}

/* ==========================================================================
   VARIANT C — PROGRESS LEDGER (plain list alternative, text-first)
   ========================================================================== */
function renderC(p) {
  const nextPos = p.next_session ? p.next_session.position : Infinity;
  const currentWeek = p.next_session ? p.next_session.week : p.weeks;

  const rowHtml = (s) => {
    const st = stateOf(s, nextPos);
    const idx = st === "done" ? TICK : String(s.position).padStart(2, "0");
    const chip = st === "done" ? '<span class="chip done">Done</span>'
      : st === "next" ? '<span class="chip next">Next</span>'
      : '<span class="chip up">Upcoming</span>';
    const action = st === "next" ? '<a class="btn btn-primary btn-tiny" href="#">▶ Start</a>'
      : st === "done" ? '<a class="btn btn-ghost btn-tiny" href="#">View</a>' : "";
    return `
      <li class="lrow ${st}">
        <span class="lidx">${idx}</span>
        <div class="lname">${s.title}<span class="lsub">Week ${s.week} · Day ${s.day}</span></div>
        ${st === "next" ? action : chip}
      </li>`;
  };

  const thisWeek = sessionsForWeek(p, currentWeek).map(rowHtml).join("");

  const fullPlan = [];
  for (let w = 1; w <= p.weeks; w++) {
    const done = sessionsForWeek(p, w).filter((s) => s.performed).length;
    const rows = sessionsForWeek(p, w).map(rowHtml).join("");
    fullPlan.push(`<div class="wk-head"><span>Week ${w}</span><span>${done}/${PER_WEEK}</span></div><ul class="ledger">${rows}</ul>`);
  }

  return `
    <div class="card vC">
      <div class="stat-split" style="margin-bottom:16px">
        <div class="stat accent">
          <div class="k">Your position</div>
          <div class="v">${p.position}<small> of ${p.total}</small></div>
        </div>
        <div class="stat">
          <div class="k">Sessions completed</div>
          <div class="v">${p.completed_count}<small> logged</small></div>
        </div>
      </div>
      <p class="no-date-note" style="margin:0 0 14px">${NO_DATE_NOTE}</p>

      <div class="divider"><span class="lbl">This week</span><span class="rule"></span><span class="meta">Week ${currentWeek}/${p.weeks}</span></div>
      <ul class="ledger">${thisWeek}</ul>

      <button class="disclosure" data-toggle="C"><span class="caret">▸</span> Full plan (all ${p.weeks} weeks)</button>
      <div data-panel="C" hidden>${fullPlan.join("")}</div>
    </div>`;
}

/* ==========================================================================
   SWITCHER + STATE
   ========================================================================== */
const VARIANTS = {
  A: { name: "Route Line", render: renderA },
  B: { name: "Metro Line", render: renderB },
  C: { name: "Progress Ledger (list)", render: renderC },
};
const ORDER = ["A", "B", "C"];

function readParams() {
  const q = new URLSearchParams(location.search);
  const v = (q.get("variant") || "A").toUpperCase();
  const s = q.get("scenario") || "current";
  return {
    variant: VARIANTS[v] ? v : "A",
    scenario: SCENARIOS[s] ? s : "current",
  };
}
function writeParams(variant, scenario) {
  const q = new URLSearchParams(location.search);
  q.set("variant", variant);
  q.set("scenario", scenario);
  history.replaceState(null, "", "?" + q.toString());
}

let state = readParams();

function paint() {
  const p = SCENARIOS[state.scenario];
  document.getElementById("mount").innerHTML = VARIANTS[state.variant].render(p);
  document.getElementById("vlabel").innerHTML = `<b>${state.variant}</b> — ${VARIANTS[state.variant].name}`;
  document.getElementById("readout").textContent =
    `variant=${state.variant} · scenario=${state.scenario} · next=#${p.position} · completed=${p.completed_count}/${p.total}`;

  // Scenario buttons pressed-state.
  document.querySelectorAll(".scenario-bar button").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.scenario === state.scenario);
  });

  // "Week complete" auto-expands the full plan so the all-solid finished week
  // is immediately visible without a tap.
  if (state.scenario === "weekComplete") {
    const btn = document.querySelector("[data-toggle]");
    if (btn) toggle(btn, true);
  }
  writeParams(state.variant, state.scenario);
}

function toggle(btn, force) {
  const key = btn.dataset.toggle;
  const panel = document.querySelector(`[data-panel="${key}"]`);
  if (!panel) return;
  const open = force !== undefined ? force : panel.hidden;
  panel.hidden = !open;
  btn.setAttribute("aria-expanded", String(open));
}

function cycle(dir) {
  const i = ORDER.indexOf(state.variant);
  state.variant = ORDER[(i + dir + ORDER.length) % ORDER.length];
  paint();
}

document.getElementById("prev").addEventListener("click", () => cycle(-1));
document.getElementById("next").addEventListener("click", () => cycle(1));
document.querySelectorAll(".scenario-bar button").forEach((b) => {
  b.addEventListener("click", () => { state.scenario = b.dataset.scenario; paint(); });
});
document.getElementById("mount").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-toggle]");
  if (btn) toggle(btn);
});
window.addEventListener("keydown", (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

paint();
</script>
</body>
</html>
