[project]
name = "workout-manager-api"
version = "0.1.0"
description = "Workout Manager FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139",
    # Pinned directly for a run of Starlette host/DoS advisories. FastAPI's own
    # range (starlette>=0.46.0, no upper bound) permits but does not require the
    # fixes, so the floor is set here explicitly:
    #   - CVE-2026-48710 ("BadHost"): a malformed Host header can desync
    #     request.url.path from the dispatched route. Fixed in 1.0.1.
    #   - CVE-2026-54282 (path host poisoning): an unvalidated request path is
    #     concatenated into the authority and re-parsed, so request.url.hostname
    #     becomes attacker-controlled (same host-desync class). Fixed in 1.3.0.
    #   - CVE-2026-54283 (form-limit-bypass DoS): request.form() max_fields /
    #     max_part_size are ignored for application/x-www-form-urlencoded bodies.
    #     Fixed in 1.3.1.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    # Parses multipart/form-data bodies, required by Starlette/FastAPI for the
    # curator Exercise Image upload (the one multipart endpoint; issue #504). Without
    # it FastAPI raises at route-registration time for any UploadFile/Form parameter.
    # Security floor: 7 advisories (two High DoS) at 0.0.12, fixed across
    # 0.0.18-0.0.31. The upload route's body is parsed *before* require_admin
    # runs, so a vulnerable parser is reachable unauthenticated
    # (docs/research/2026-10-05.md, Sec #3).
    "python-multipart>=0.0.31",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    # Security floor: 15 advisories at 2.9, fixed across 2.12-2.15, incl.
    # CVE-2026-102265 (RecursionError from a nested header escapes PyJWTError;
    # verify_clerk_jwt also guards against it itself) (docs/research/2026-10-05.md,
    # Sec #2).
    "pyjwt[crypto]>=2.15.1",
    # Runtime floor for the RS256 backend behind pyjwt[crypto], whose own floor
    # is >=3.4: CVE-2026-69248 / CVE-2026-69249 are fixed in 49.0.0
    # (docs/research/2026-10-05.md, Sec #7).
    "cryptography>=49",
    "httpx>=0.27",
    "redis>=5.1",
    "rq>=2.0",
    "anthropic>=0.40",
    "openai>=2.44.0",
    "google-genai>=2.10",
    # Operational AI-usage monitoring (ADR-0039). Used only by the production
    # LangfuseGenerationCallRecorder and imported lazily, so the offline suite
    # (no-op recorder) never touches it. Pinned to the v2 major line: the
    # recorder speaks the low-level v2 client API (``client.trace(...)`` ->
    # ``.generation(...)``, ``client.api.trace`` erasure, ``client.flush()``),
    # which the v3 SDK rewrite (OpenTelemetry-based, no ``trace()`` method)
    # removed. Bumping to v3 is a recorder rewrite, not a version bump.
    "langfuse>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/session.py",
    "app/alembic/*",
    "app/main.py",
    "app/generation/worker.py",
]
